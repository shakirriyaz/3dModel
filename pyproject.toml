[project]
name = "autoplant"
version = "0.1.0"
description = "Automated plant 3D design: P&ID/line list in, routed 3D model + IFC/DXF/isometrics/BOM/QC out"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "numpy", "networkx", "ezdxf", "ifcopenshell", "reportlab", "fastapi", "uvicorn", "python-multipart"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
autoplant = "autoplant.cli:main"

[tool.setuptools]
packages = ["autoplant", "autoplant.export", "autoplant.web"]

[tool.setuptools.package-data]
autoplant = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
