<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoPlant</title>
<style>
:root{--bg:#fff;--fg:#1a2230;--mut:#5b6678;--card:#f4f6fa;--bd:#d9dfe9;--ok:#1b7f3b;--bad:#b3261e;--acc:#1f5eff}
@media(prefers-color-scheme:dark){:root{--bg:#0f141c;--fg:#e6ebf3;--mut:#9aa6b8;--card:#171e29;--bd:#2a3342;--ok:#5fd18a;--bad:#ff8a80;--acc:#7aa2ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Arial}
main{max-width:900px;margin:0 auto;padding:20px 16px 60px}h1{margin:0 0 4px}p.s{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
label{display:block;margin:8px 0 4px;font-weight:600}select,input[type=file]{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg)}
.checks{display:flex;flex-wrap:wrap;gap:6px 18px}.checks label{font-weight:400;margin:0}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:11px 22px;font-size:15px;cursor:pointer;margin-top:14px}
button:disabled{opacity:.5}.ok{color:var(--ok)}.bad{color:var(--bad)}table{width:100%;border-collapse:collapse;font-size:13px}
td,th{border-bottom:1px solid var(--bd);padding:5px 6px;text-align:left}a{color:var(--acc)}iframe{width:100%;height:480px;border:1px solid var(--bd);border-radius:8px}
.warn{font-size:13px;color:var(--mut)}
</style></head><body><main>
<h1>AutoPlant</h1><p class="s">Give inputs, pick outputs. Layout, routing and QC run automatically.</p>
<form id="f" class="card">
<label>Input file (project .json or DEXPI .xml)</label><input type="file" id="file" accept=".json,.xml">
<label>…or built-in example</label><select id="ex"><option value="">(none)</option></select>
<label>Design standard profile</label><select id="std"></select><div class="warn" id="stdw"></div>
<label>Outputs</label><div class="checks" id="outs"></div>
<button id="go" type="submit">Run</button>
</form>
<div id="res"></div>
<script>
const $=id=>document.getElementById(id);let prof={};
fetch('/api/options').then(r=>r.json()).then(o=>{prof=o.standards;
 for(const k in o.standards){const e=document.createElement('option');e.value=k;e.textContent=k+' – '+o.standards[k].description;$('std').appendChild(e)}
 o.examples.forEach(x=>{const e=document.createElement('option');e.value=x;e.textContent=x;$('ex').appendChild(e)});
 $('outs').innerHTML=o.outputs.map(x=>`<label><input type="checkbox" name="o" value="${x}" checked> ${x}</label>`).join('');
 upd();});
function upd(){const p=prof[$('std').value];$('stdw').textContent=p&&!p.validated?'⚠ Placeholder design rules – not validated against a real piping design basis.':''}
$('std').onchange=upd;
$('f').onsubmit=async ev=>{ev.preventDefault();const fd=new FormData();
 if($('file').files[0])fd.append('file',$('file').files[0]);else fd.append('example',$('ex').value);
 fd.append('standard',$('std').value);fd.append('outputs',[...document.querySelectorAll('[name=o]:checked')].map(c=>c.value).join(','));
 $('go').disabled=true;$('res').innerHTML='<div class="card">Running…</div>';
 const r=await fetch('/api/run',{method:'POST',body:fd});const j=await r.json();$('go').disabled=false;
 if(!r.ok){$('res').innerHTML=`<div class="card bad">Error: ${j.detail}</div>`;return}
 const q=j.qc,base=`/api/jobs/${j.job}/file/`;
 $('res').innerHTML=`<div class="card"><h2 class="${q.passed?'ok':'bad'}">QC ${j.status}</h2>
 <div>${q.errors} errors · ${q.warnings} warnings · ${j.seconds}s · standard <b>${q.standard}</b>${q.standard_validated?'':' (unvalidated)'}</div>
 <p><a href="/api/jobs/${j.job}/zip"><b>Download all (zip)</b></a></p>
 <div>${j.files.map(f=>`<a href="${base+f}" target="_blank">${f}</a>`).join(' · ')}</div></div>
 ${q.items.length?`<div class="card"><table><tr><th>Sev</th><th>Check</th><th>Subject</th><th>Message</th></tr>${q.items.map(i=>`<tr><td class="${i.severity=='error'?'bad':''}">${i.severity}</td><td>${i.check}</td><td>${i.subject}</td><td>${i.message}</td></tr>`).join('')}</table></div>`:''}
 ${j.files.includes('viewer.html')?`<iframe src="${base}viewer.html"></iframe>`:''}`;};
</script></main></body></html>
